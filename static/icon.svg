<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

  <!-- Book Body -->
  <path d="M140 370 V190 C140 160, 180 150, 240 165 L256 170 L272 165 C332 150, 372 160, 372 190 V370 C372 345, 330 335, 260 348 L256 349 L252 348 C182 335, 140 345, 140 370 Z" 
        fill="url(#accentGrad)" opacity="0.95"/>
  <path d="M256 170 V349" stroke="#0b0f19" stroke-width="4" stroke-linecap="round"/>

  <!-- Headphones Arc -->
  <path d="M120 270 C120 170, 175 100, 256 100 C337 100, 392 170, 392 270" 
        fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- Headphone Ear Cups -->
  <rect x="96" y="250" width="36" height="72" rx="18" fill="#38bdf8"/>
  <rect x="380" y="250" width="36" height="72" rx="18" fill="#818cf8"/>
  
  <!-- Play Indicator Triangle inside Book -->
  <polygon points="244,235 278,255 244,275" fill="#0b0f19"/>
</svg>
